esphome:
  name: esp-reboot-switch
  friendly_name: ESP Reboot Switch
  comment: "Устройство перезагрузки"
  includes:
    - password_manager.h
  on_boot:
    priority: 800.0
    then:
      - logger.log: ">>> ЗАПУСК PASSWORD MANAGER <<<"
      - lambda: 'bind_password_status_sensor(id(password_status));'
      - lambda: |-
          initPasswordManager();

esp8266:
  board: esp01_1m

logger:
  level: INFO

api:
  encryption:
    key: !secret esp_reboot_switch__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  on_connect:
    - lambda: 'clearWifiApOnlyFlag();'
  
  ap:
    ssid: "ESP-Reboot-Switch-AP"
    password: "12345678"
  
  reboot_timeout: 120s
  power_save_mode: none

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

safe_mode:
  num_attempts: 10
  reboot_timeout: 10min

interval:
  - interval: 5min
    then:
      - logger.log: "Watchdog check"

switch:
  - platform: gpio
    name: "Питание"
    pin: GPIO0
    id: server_power_relay
    restore_mode: ALWAYS_ON
    inverted: false
    icon: "mdi:power-socket"
    on_state:
      - text_sensor.template.publish:
          id: relay_state_text
          state: !lambda |-
            if (id(server_power_relay).state) {
              return {"NC замкнут"};
            } else {
              return {"NO замкнут"};
            }


  - platform: template
    name: "Веб-интерфейс"
    id: web_interface_switch
    icon: "mdi:web"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'set_web_enabled(true);'
    turn_off_action:
      - lambda: 'set_web_enabled(false);'

script:
  - id: reboot_sequence
    then:
      - if:
          condition:
            switch.is_on: server_power_relay
          then:
            - switch.turn_off: server_power_relay
            - delay: !lambda "return (uint32_t)(id(reboot_delay_seconds).state * 1000);"
            - switch.turn_on: server_power_relay

button:
  - platform: template
    name: "Перезагрузить"
    icon: "mdi:restart"
    on_press:
      - script.execute: reboot_sequence

number:
  - platform: template
    name: "Время отключения (сек)"
    id: reboot_delay_seconds
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    unit_of_measurement: "сек"
    mode: box
    icon: "mdi:timer-outline"

text:
  - platform: template
    name: "Новый пароль"
    id: new_password_text
    mode: password
    optimistic: true
    on_value:
      then:
        - lambda: 'set_new_password(x.c_str());'

binary_sensor:
  - platform: status
    name: "Статус подключения"

text_sensor:
  - platform: version
    name: "Версия прошивки"
    
  - platform: wifi_info
    ip_address:
      name: "IP адрес"
 
  - platform: template
    name: "Статус пароля"
    id: password_status
    icon: "mdi:key"

  - platform: template
    name: "Состояние реле"
    id: relay_state_text
    icon: "mdi:electric-switch"
    lambda: |-
      if (id(server_power_relay).state) {
        return {"NC замкнут"};
      } else {
        return {"NO замкнут"};
      }

sensor:
  - platform: uptime
    name: "Время работы"
    id: uptime_sensor
    update_interval: 60s
    icon: "mdi:clock-outline"
  
  - platform: wifi_signal
    name: "Уровень WiFi сигнала"
    id: wifi_signal_db
    update_interval: 60s
    icon: "mdi:wifi"

select:
  - platform: template
    name: "Поведение при включении питания"
    id: power_on_behavior
    options:
      - "Всегда включено"
      - "Всегда выключено"
      - "Восстановить последнее состояние"
    initial_option: "Всегда включено"
    optimistic: true
    icon: "mdi:power-settings"
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "Всегда включено";'
            then:
              - switch.turn_on: server_power_relay
        - if:
            condition:
              lambda: 'return x == "Всегда выключено";'
            then:
              - switch.turn_off: server_power_relay
